<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Crappy Hack-n-Slash</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #111; }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: absolute; top: 10px; left: 10px; color: white;
      font-family: monospace; font-size: 20px; text-shadow: 1px 1px 2px black;
      pointer-events: none; user-select: none;
    }
    #gameover {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
      color: red; font-family: monospace; font-size: 48px; display: none;
    }
    #startScreen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #111; color: white; font-family: monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; z-index: 10;
    }
    #startScreen button {
      font-family: monospace; font-size: 18px; padding: 10px 20px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <div>crappy hack-n-slash (now with phonk)</div>
    <input type="file" id="songPicker" accept="audio/*">
    <button id="startBtn">start (no music, that's fine too)</button>
  </div>
  <canvas id="renderCanvas"></canvas>
  <div id="hud">HP: <span id="hp">100</span> | Kills: <span id="kills">0</span></div>
  <div id="gameover">YOU DIED<br><span style="font-size:20px">refresh to try again</span></div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    // ---- Game state ----
    let playerHP = 100;
    let kills = 0;
    let gameOver = false;
    const enemies = [];
    const ATTACK_RANGE = 2.5;
    const ATTACK_COOLDOWN = 0.5; // seconds
    let attackTimer = 0;

    const hpEl = document.getElementById("hp");
    const killsEl = document.getElementById("kills");
    const gameoverEl = document.getElementById("gameover");
    const startScreen = document.getElementById("startScreen");
    const songPicker = document.getElementById("songPicker");
    const startBtn = document.getElementById("startBtn");

    // ---- Audio-reactive setup ----
    // This is the Web Audio equivalent of Unity's AudioSource.GetSpectrumData().
    let audioEl = null;
    let analyser = null;
    let freqData = null;
    let bass = 0; // 0..1 smoothed "how loud is it right now" value, same role as highestBass in the C#

    function setupAudio(fileOrNull) {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioEl = new Audio();
      audioEl.loop = true;
      audioEl.crossOrigin = "anonymous";

      if (fileOrNull) {
        audioEl.src = URL.createObjectURL(fileOrNull);
      }

      const source = audioCtx.createMediaElementSource(audioEl);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512; // smaller = fewer bins, fine for "grab a loudness number"
      analyser.minDecibels = -90;
      analyser.maxDecibels = -10; // widen the range so quiet vs loud spreads out more before scaling
      analyser.smoothingTimeConstant = 0; // no built-in smoothing - we want raw per-frame values
      freqData = new Uint8Array(analyser.frequencyBinCount);

      source.connect(analyser);
      analyser.connect(audioCtx.destination);

      if (fileOrNull) {
        audioEl.play();
      }
    }

    let phonkometer = 1; // multiplier on raw bass, equivalent to SaveScene.PhonkometerData - tune this

    function updateBass() {
      if (!analyser) return;
      analyser.getByteFrequencyData(freqData);

      // Narrow band around the kick drum fundamental (roughly 50-120Hz) instead of
      // scanning a wide range - this avoids picking up sustained bassline/sub content
      // that sits loud the whole time, and isolates the actual kick transient.
      const bassBinStart = 1;
      const bassBinEnd = 3;
      let highestBass = 0;
      for (let i = bassBinStart; i <= bassBinEnd; i++) {
        if (freqData[i] > highestBass) highestBass = freqData[i];
      }
      let normalized = highestBass / 255; // 0..1

      // Web Audio's byte output is dB-compressed, so quiet-vs-loud bass sits closer
      // together than you'd expect - a steep power curve widens that gap back out,
      // so only genuinely loud kicks (close to 1.0) produce a real spike.
      normalized = Math.pow(normalized, 4);

      bass = normalized * phonkometer;
    }

    startBtn.addEventListener("click", () => {
      setupAudio(songPicker.files[0] || null);
      startScreen.style.display = "none";
    });

    const createScene = function () {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color3(0.05, 0.05, 0.08);

      // ---- Camera (top-down-ish follow cam) ----
      const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2, 1.0, 25, BABYLON.Vector3.Zero(), scene);
      camera.lowerRadiusLimit = 10;
      camera.upperRadiusLimit = 15;
      camera.lowerBetaLimit = 1.0;
      camera.upperBetaLimit = 1.0;
      camera.inputs.clear(); // no mouse dragging, we control it manually

      // ---- Light ----
      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
      light.intensity = 0.9;

      // ---- Post-process pipeline (Babylon's equivalent of the Volume/Bloom/LensDistortion/ChromaticAberration setup) ----
      const pipeline = new BABYLON.DefaultRenderingPipeline("pipeline", true, scene, [camera]);
      pipeline.bloomEnabled = true;
      pipeline.bloomThreshold = 0.6;
      pipeline.bloomWeight = 0.4;
      pipeline.bloomKernel = 64;
      pipeline.chromaticAberrationEnabled = true;
      pipeline.chromaticAberration.aberrationAmount = 0;
      pipeline.grainEnabled = false;

      // color cycle, same idea as CycleTextColor() in the Unity script
      const beatColors = [
        new BABYLON.Color3(1, 0, 0),
        new BABYLON.Color3(1, 0.65, 0),
        new BABYLON.Color3(1, 1, 0),
        new BABYLON.Color3(0.2, 1, 0.2),
        new BABYLON.Color3(0.2, 0.2, 1),
        new BABYLON.Color3(0.53, 0, 1),
        new BABYLON.Color3(1, 0.5, 1)
      ];
      let colorIdx = 0;
      let colorLerpT = 0;

      // ---- GUI layer (screen-space, same role as your Canvas/RawImages in Unity) ----
      const gui = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI", true, scene);

      // --- decorative pulsing sprites, like horse1-4 ---
      // Replace these paths with your actual image files.
      const decoPaths = [
        "assets/horseface.png",
        "assets/horseface2.png",
        "assets/horseface3.png",
        "assets/horseface4.png"
      ];
      const decoCorners = [
        { horizontalAlignment: BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT, verticalAlignment: BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP },
        { horizontalAlignment: BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_RIGHT, verticalAlignment: BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP },
        { horizontalAlignment: BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT, verticalAlignment: BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM },
        { horizontalAlignment: BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_RIGHT, verticalAlignment: BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM }
      ];
      const decoImages = decoPaths.map((path, i) => {
        const img = new BABYLON.GUI.Image("deco" + i, path);
        img.width = "300px";
        img.height = "300px";
        img.horizontalAlignment = decoCorners[i].horizontalAlignment;
        img.verticalAlignment = decoCorners[i].verticalAlignment;
        img.paddingLeft = "20px";
        img.paddingRight = "20px";
        img.paddingTop = "20px";
        img.paddingBottom = "20px";
        gui.addControl(img);
        return img;
      });

      // --- image-based health bar ---
      // barFrame is the static border/background, barFill is the part that scales with HP.
      const barFrame = new BABYLON.GUI.Image("barFrame", "assets/healthbar_frame.png");
      barFrame.width = "300px";
      barFrame.height = "40px";
      barFrame.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
      barFrame.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
      barFrame.paddingLeft = "20px";
      barFrame.paddingTop = "20px";
      gui.addControl(barFrame);

      const barFill = new BABYLON.GUI.Image("barFill", "assets/healthbar_fill.png");
      barFill.width = "290px";
      barFill.height = "30px";
      barFill.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
      barFill.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
      barFill.paddingLeft = "25px";
      barFill.paddingTop = "25px";
      gui.addControl(barFill);

      // ---- Ground ----
      const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 60, height: 60 }, scene);
      const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
      groundMat.diffuseColor = new BABYLON.Color3(0.2, 0.3, 0.2);
      ground.material = groundMat;

      // ---- Model facing-offset corrections ----
      // Every glTF export can have a different "forward" axis baked in. These constants
      // exist purely to correct for that mismatch - try 0, Math.PI/2, Math.PI, or
      // -Math.PI/2 for each until the model visually faces the direction it's moving.
      const HORSE_FACING_OFFSET = 0; // was Math.PI, try 0 first since PI made it worse
      const ENEMY_FACING_OFFSET = Math.PI / 2; // requested 90 degree correction

      // ---- Player: horse model with character riding on top ----
      // playerRoot is what actually moves - both models get parented to it so they
      // move/rotate together, same as parenting the character to the horse bone in Unity.
      const playerRoot = new BABYLON.TransformNode("playerRoot", scene);
      playerRoot.position.y = 0;
      let playerMaterials = []; // collected after load, used for the beat-glow effect

      const horseImport = BABYLON.ImportMeshAsync("assets/horse.glb", scene).then((result) => {
        const horseRoot = result.meshes[0]; // "__root__" of the imported hierarchy
        horseRoot.parent = playerRoot;
        // Recenter the model under playerRoot - adjust this if the horse still
        // looks offset (its glTF pivot isn't necessarily at the model's center).
        // Negative Z = further back relative to playerRoot's forward direction.
        horseRoot.position.set(0, 0, -2);
        // The model's forward axis doesn't match our movement math (+Z = forward).
        // HORSE_FACING_OFFSET below is the fix - try 0, Math.PI, Math.PI/2, or
        // -Math.PI/2 until the horse visually faces the direction it's moving.
        horseRoot.rotationQuaternion = null; // glTF imports often set this, which silently overrides .rotation
        horseRoot.rotation.y = HORSE_FACING_OFFSET;
        horseRoot.scaling.setAll(0.8);
        result.meshes.forEach((m) => { if (m.material) playerMaterials.push(m.material); });
        return horseRoot;
      });

      const characterImport = BABYLON.ImportMeshAsync("assets/character.glb", scene).then((result) => {
        const characterRoot = result.meshes[0];
        characterRoot.parent = playerRoot;
        // Sitting position on the horse's back - these numbers are a starting guess,
        // adjust x/y/z until the character actually looks seated.
        characterRoot.position.set(0, 1.7, -0.9);
        characterRoot.rotation.y = MATH.PI;
        characterRoot.scaling.setAll(25);
        result.meshes.forEach((m) => { if (m.material) playerMaterials.push(m.material); });
        return characterRoot;
      });

      // ---- Enemy model template ----
      // Load the enemy model once, keep it disabled and off to the side, then clone()
      // it for every spawn instead of re-importing the file per enemy.
      let enemyTemplate = null;
      let enemyMaterials = [];
      const enemyImport = BABYLON.ImportMeshAsync("assets/enemy.glb", scene).then((result) => {
        enemyTemplate = result.meshes[0];
        enemyTemplate.setEnabled(false);
        result.meshes.forEach((m) => { if (m.material) enemyMaterials.push(m.material); });
        return enemyTemplate;
      });

      // ---- Input ----
      const inputMap = {};
      scene.actionManager = new BABYLON.ActionManager(scene);
      scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger, (e) => {
        inputMap[e.sourceEvent.key.toLowerCase()] = true;
      }));
      scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger, (e) => {
        inputMap[e.sourceEvent.key.toLowerCase()] = false;
      }));

      // ---- Enemy spawning ----
      function spawnEnemy() {
        if (!enemyTemplate) return; // model isn't loaded yet, skip this spawn tick
        const enemy = enemyTemplate.clone("enemy", null);
        enemy.setEnabled(true);
        enemy.rotationQuaternion = null; // clear this so setting .rotation.y in the chase loop actually works

        // spawn at a random point on a circle around the player
        const angle = Math.random() * Math.PI * 2;
        const dist = 20;
        enemy.position.x = playerRoot.position.x + Math.cos(angle) * dist;
        enemy.position.z = playerRoot.position.z + Math.sin(angle) * dist;
        enemy.position.y = 0;

        enemy.metadata = { speed: 3 + Math.random() * 1.5, baseScale: 0.75 };
        enemies.push(enemy);
      }

      let spawnTimer = 0;
      let spawnInterval = 2.5; // gets faster over time

      // ---- Main loop ----
      scene.onBeforeRenderObservable.add(() => {
        if (gameOver) return;

        const dt = engine.getDeltaTime() / 1000;

        // --- movement ---
        const moveSpeed = 8;
        let dx = 0, dz = 0;
        if (inputMap["w"] || inputMap["arrowup"]) dz += 1;
        if (inputMap["s"] || inputMap["arrowdown"]) dz -= 1;
        if (inputMap["a"] || inputMap["arrowleft"]) dx -= 1;
        if (inputMap["d"] || inputMap["arrowright"]) dx += 1;

        const moveVec = new BABYLON.Vector3(dx, 0, dz);
        if (moveVec.length() > 0) {
          moveVec.normalize();
          playerRoot.position.x += moveVec.x * moveSpeed * dt;
          playerRoot.position.z += moveVec.z * moveSpeed * dt;
          // face movement direction
          playerRoot.rotation.y = Math.atan2(moveVec.x, moveVec.z);
        }

        // camera follows player
        camera.target.x = playerRoot.position.x;
        camera.target.z = playerRoot.position.z;

        // --- attack ---
        attackTimer -= dt;
        if (inputMap[" "] && attackTimer <= 0) {
          attackTimer = ATTACK_COOLDOWN;
          for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            if (BABYLON.Vector3.Distance(playerRoot.position, e.position) <= ATTACK_RANGE) {
              e.dispose();
              enemies.splice(i, 1);
              kills++;
              killsEl.textContent = kills;
            }
          }
        }

        // --- enemies chase player ---
        for (const e of enemies) {
          const dir = playerRoot.position.subtract(e.position);
          dir.y = 0;
          const distToPlayer = dir.length();
          if (distToPlayer > 0.01) {
            dir.normalize();
            e.position.x += dir.x * e.metadata.speed * dt;
            e.position.z += dir.z * e.metadata.speed * dt;
            e.rotation.y = Math.atan2(dir.x, dir.z) + ENEMY_FACING_OFFSET; // face the player while chasing, corrected for model orientation
          }

          // enemy hits player
          if (distToPlayer < 1.3) {
            playerHP -= 20 * dt; // damage per second while touching
            hpEl.textContent = Math.max(0, Math.floor(playerHP));
            barFill.width = (290 * Math.max(0, playerHP) / 100) + "px";
            if (playerHP <= 0 && !gameOver) {
              gameOver = true;
              gameoverEl.style.display = "block";
            }
          }
        }

        // --- spawning ---
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnEnemy();
          spawnTimer = spawnInterval;
          spawnInterval = Math.max(0.6, spawnInterval * 0.97); // ramp difficulty
        }

        // --- audio-reactive visuals (the whole point of this exercise) ---
        updateBass();

        // camera "punch in" on bass hits, like the OrthographicSize shrink in the C#
        camera.radius = Math.max(4, 15 - bass * 4);
        // small random shake added on top while bass is active, for that volatile feel
        if (bass > 0.05) {
          camera.targetScreenOffset.x = (Math.random() - 0.5) * Math.min(bass, 1) * 0.3;
          camera.targetScreenOffset.y = (Math.random() - 0.5) * Math.min(bass, 1) * 0.3;
        } else {
          camera.targetScreenOffset.x = 0;
          camera.targetScreenOffset.y = 0;
        }

        // bloom/aberration intensity scale with loudness
        pipeline.bloomWeight = 0.4 + Math.min(bass, 1) * 1.5;
        pipeline.bloomThreshold = Math.max(0.1, 0.6 - Math.min(bass, 1) * 0.3);
        pipeline.chromaticAberration.aberrationAmount = Math.min(bass, 1) * 30;

        // cycling color, same Lerp-between-two-colors-then-advance pattern as CycleTextColor
        colorLerpT += Math.min(bass, 1) * dt * 4 + dt * 0.15;
        if (colorLerpT >= 1) {
          colorLerpT = 0;
          colorIdx = (colorIdx + 1) % beatColors.length;
        }
        const nextIdx = (colorIdx + 1) % beatColors.length;
        const beatColor = BABYLON.Color3.Lerp(beatColors[colorIdx], beatColors[nextIdx], colorLerpT);

        // enemies pulse color + scale with the beat, filling the role of the horse1-4 RawImages
        // Note: all enemy clones share the same template materials, so tinting once here
        // affects every enemy on screen at once - cheaper than looping per-enemy.
        for (const mat of enemyMaterials) {
          if (mat.emissiveColor !== undefined) mat.emissiveColor = beatColor.scale(Math.min(bass, 1));
        }
        const enemyPulse = 1 + Math.min(bass, 1) * 0.6;
        for (const e of enemies) {
          const s = e.metadata.baseScale * enemyPulse;
          e.scaling.set(s, s, s);
        }

        // player (horse + character) glows a bit too on hard hits
        for (const mat of playerMaterials) {
          if (mat.emissiveColor !== undefined) mat.emissiveColor = beatColor.scale(Math.min(bass, 1) * 0.5);
        }

        // decorative GUI images pulse scale + tint with the beat, same role as horse1-4
        const decoScale = 1 + Math.min(bass, 1) * 0.8;
        for (const img of decoImages) {
          img.scaleX = decoScale;
          img.scaleY = decoScale;
          img.color = beatColor.toHexString();
          img.alpha = 0.5 + Math.min(bass, 1) * 0.5;
          // vibration: jitter the image's on-screen offset while bass is hitting hard
          if (bass > 0.1) {
            img.left = (Math.random() - 0.5) * Math.min(bass, 3) * 20 + "px";
            img.top = (Math.random() - 0.5) * Math.min(bass, 3) * 20 + "px";
          } else {
            img.left = "0px";
            img.top = "0px";
          }
        }
      });

      return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });
  </script>
</body>
</html>
