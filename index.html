<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Crappy Hack-n-Slash</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #111; }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: absolute; top: 10px; left: 10px; color: white;
      font-family: monospace; font-size: 20px; text-shadow: 1px 1px 2px black;
      pointer-events: none; user-select: none;
    }
    #gameover {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
      color: red; font-family: monospace; font-size: 48px; display: none;
    }
    #startScreen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #111; color: white; font-family: monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; z-index: 10;
    }
    #startScreen button {
      font-family: monospace; font-size: 18px; padding: 10px 20px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <div>crappy hack-n-slash (now with phonk)</div>
    <input type="file" id="songPicker" accept="audio/*">
    <button id="startBtn">start (no music, that's fine too)</button>
  </div>
  <canvas id="renderCanvas"></canvas>
  <div id="hud">HP: <span id="hp">100</span> | Kills: <span id="kills">0</span></div>
  <div id="gameover">YOU DIED<br><span style="font-size:20px">refresh to try again</span></div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    // ---- Game state ----
    let playerHP = 100;
    let kills = 0;
    let gameOver = false;
    const enemies = [];
    const ATTACK_RANGE = 2.5;
    const ATTACK_COOLDOWN = 0.5; // seconds
    let attackTimer = 0;

    const hpEl = document.getElementById("hp");
    const killsEl = document.getElementById("kills");
    const gameoverEl = document.getElementById("gameover");
    const startScreen = document.getElementById("startScreen");
    const songPicker = document.getElementById("songPicker");
    const startBtn = document.getElementById("startBtn");

    // ---- Audio-reactive setup ----
    // This is the Web Audio equivalent of Unity's AudioSource.GetSpectrumData().
    let audioEl = null;
    let analyser = null;
    let freqData = null;
    let bass = 0; // 0..1 smoothed "how loud is it right now" value, same role as highestBass in the C#

    function setupAudio(fileOrNull) {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioEl = new Audio();
      audioEl.loop = true;
      audioEl.crossOrigin = "anonymous";

      if (fileOrNull) {
        audioEl.src = URL.createObjectURL(fileOrNull);
      }

      const source = audioCtx.createMediaElementSource(audioEl);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512; // smaller = fewer bins, fine for "grab a loudness number"
      freqData = new Uint8Array(analyser.frequencyBinCount);

      source.connect(analyser);
      analyser.connect(audioCtx.destination);

      if (fileOrNull) {
        audioEl.play();
      }
    }

    function updateBass() {
      if (!analyser) return;
      analyser.getByteFrequencyData(freqData);

      // Only look at the low end of the spectrum (actual "bass"), not the whole mix.
      // At fftSize 512 with a 44.1kHz source, each bin is ~43Hz wide, so bins 1-8
      // cover roughly 40-350Hz - kick drum / sub-bass territory.
      const bassBinStart = 1;
      const bassBinEnd = 8;
      let peak = 0;
      for (let i = bassBinStart; i <= bassBinEnd; i++) {
        if (freqData[i] > peak) peak = freqData[i];
      }
      let normalized = peak / 255; // 0..1

      // Threshold + curve: ignore quiet rumble, only react once bass actually hits,
      // and push the response curve so mid hits don't look the same as full hits.
      const threshold = 0.55;
      normalized = normalized < threshold ? 0 : (normalized - threshold) / (1 - threshold);
      normalized = Math.pow(normalized, 1.5);

      // Punchy envelope: snap UP fast on a hit, fall back DOWN fast between hits.
      // This is what makes it feel like discrete "explosions" instead of a smooth wobble.
      if (normalized > bass) {
        bass = BABYLON.Scalar.Lerp(bass, normalized, 0.9); // near-instant attack
      } else {
        bass = BABYLON.Scalar.Lerp(bass, normalized, 0.25); // quick decay
      }
    }

    startBtn.addEventListener("click", () => {
      setupAudio(songPicker.files[0] || null);
      startScreen.style.display = "none";
    });

    const createScene = function () {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color3(0.05, 0.05, 0.08);

      // ---- Camera (top-down-ish follow cam) ----
      const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2, 1.0, 25, BABYLON.Vector3.Zero(), scene);
      camera.lowerRadiusLimit = 10;
      camera.upperRadiusLimit = 15;
      camera.lowerBetaLimit = 1.0;
      camera.upperBetaLimit = 1.0;
      camera.inputs.clear(); // no mouse dragging, we control it manually

      // ---- Light ----
      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
      light.intensity = 0.9;

      // ---- Post-process pipeline (Babylon's equivalent of the Volume/Bloom/LensDistortion/ChromaticAberration setup) ----
      const pipeline = new BABYLON.DefaultRenderingPipeline("pipeline", true, scene, [camera]);
      pipeline.bloomEnabled = true;
      pipeline.bloomThreshold = 0.6;
      pipeline.bloomWeight = 0.4;
      pipeline.bloomKernel = 64;
      pipeline.chromaticAberrationEnabled = true;
      pipeline.chromaticAberration.aberrationAmount = 0;
      pipeline.grainEnabled = false;

      // color cycle, same idea as CycleTextColor() in the Unity script
      const beatColors = [
        new BABYLON.Color3(1, 0, 0),
        new BABYLON.Color3(1, 0.65, 0),
        new BABYLON.Color3(1, 1, 0),
        new BABYLON.Color3(0.2, 1, 0.2),
        new BABYLON.Color3(0.2, 0.2, 1),
        new BABYLON.Color3(0.53, 0, 1),
        new BABYLON.Color3(1, 0.5, 1)
      ];
      let colorIdx = 0;
      let colorLerpT = 0;

      // ---- GUI layer (screen-space, same role as your Canvas/RawImages in Unity) ----
      const gui = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI", true, scene);

      // --- decorative pulsing sprites, like horse1-4 ---
      // Replace these paths with your actual image files.
      const decoPaths = [
        "assets/horseface.png",
        "assets/horseface2.png",
        "assets/horseface3.png",
        "assets/horseface4.png"
      ];
      const decoCorners = [
        { horizontalAlignment: BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT, verticalAlignment: BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP },
        { horizontalAlignment: BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_RIGHT, verticalAlignment: BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP },
        { horizontalAlignment: BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT, verticalAlignment: BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM },
        { horizontalAlignment: BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_RIGHT, verticalAlignment: BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM }
      ];
      const decoImages = decoPaths.map((path, i) => {
        const img = new BABYLON.GUI.Image("deco" + i, path);
        img.width = "300px";
        img.height = "300px";
        img.horizontalAlignment = decoCorners[i].horizontalAlignment;
        img.verticalAlignment = decoCorners[i].verticalAlignment;
        img.paddingLeft = "20px";
        img.paddingRight = "20px";
        img.paddingTop = "20px";
        img.paddingBottom = "20px";
        gui.addControl(img);
        return img;
      });

      // --- image-based health bar ---
      // barFrame is the static border/background, barFill is the part that scales with HP.
      const barFrame = new BABYLON.GUI.Image("barFrame", "assets/healthbar_frame.png");
      barFrame.width = "300px";
      barFrame.height = "40px";
      barFrame.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
      barFrame.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
      barFrame.paddingLeft = "20px";
      barFrame.paddingTop = "20px";
      gui.addControl(barFrame);

      const barFill = new BABYLON.GUI.Image("barFill", "assets/healthbar_fill.png");
      barFill.width = "290px";
      barFill.height = "30px";
      barFill.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
      barFill.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
      barFill.paddingLeft = "25px";
      barFill.paddingTop = "25px";
      gui.addControl(barFill);

      // ---- Ground ----
      const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 60, height: 60 }, scene);
      const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
      groundMat.diffuseColor = new BABYLON.Color3(0.2, 0.3, 0.2);
      ground.material = groundMat;

      // ---- Player ----
      const player = BABYLON.MeshBuilder.CreateCapsule("player", { height: 2, radius: 0.5 }, scene);
      player.position.y = 1;
      const playerMat = new BABYLON.StandardMaterial("playerMat", scene);
      playerMat.diffuseColor = new BABYLON.Color3(0.2, 0.6, 1);
      player.material = playerMat;

      // ---- Input ----
      const inputMap = {};
      scene.actionManager = new BABYLON.ActionManager(scene);
      scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger, (e) => {
        inputMap[e.sourceEvent.key.toLowerCase()] = true;
      }));
      scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger, (e) => {
        inputMap[e.sourceEvent.key.toLowerCase()] = false;
      }));

      // ---- Enemy spawning ----
      function spawnEnemy() {
        const enemy = BABYLON.MeshBuilder.CreateBox("enemy", { size: 1.2 }, scene);
        const mat = new BABYLON.StandardMaterial("enemyMat", scene);
        mat.diffuseColor = new BABYLON.Color3(1, 0.2, 0.2);
        enemy.material = mat;

        // spawn at a random point on a circle around the player
        const angle = Math.random() * Math.PI * 2;
        const dist = 20;
        enemy.position.x = player.position.x + Math.cos(angle) * dist;
        enemy.position.z = player.position.z + Math.sin(angle) * dist;
        enemy.position.y = 0.6;

        enemy.metadata = { speed: 3 + Math.random() * 1.5 };
        enemies.push(enemy);
      }

      let spawnTimer = 0;
      let spawnInterval = 2.5; // gets faster over time

      // ---- Main loop ----
      scene.onBeforeRenderObservable.add(() => {
        if (gameOver) return;

        const dt = engine.getDeltaTime() / 1000;

        // --- movement ---
        const moveSpeed = 8;
        let dx = 0, dz = 0;
        if (inputMap["w"] || inputMap["arrowup"]) dz += 1;
        if (inputMap["s"] || inputMap["arrowdown"]) dz -= 1;
        if (inputMap["a"] || inputMap["arrowleft"]) dx -= 1;
        if (inputMap["d"] || inputMap["arrowright"]) dx += 1;

        const moveVec = new BABYLON.Vector3(dx, 0, dz);
        if (moveVec.length() > 0) {
          moveVec.normalize();
          player.position.x += moveVec.x * moveSpeed * dt;
          player.position.z += moveVec.z * moveSpeed * dt;
          // face movement direction
          player.rotation.y = Math.atan2(moveVec.x, moveVec.z);
        }

        // camera follows player
        camera.target.x = player.position.x;
        camera.target.z = player.position.z;

        // --- attack ---
        attackTimer -= dt;
        if (inputMap[" "] && attackTimer <= 0) {
          attackTimer = ATTACK_COOLDOWN;
          for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            if (BABYLON.Vector3.Distance(player.position, e.position) <= ATTACK_RANGE) {
              e.dispose();
              enemies.splice(i, 1);
              kills++;
              killsEl.textContent = kills;
            }
          }
        }

        // --- enemies chase player ---
        for (const e of enemies) {
          const dir = player.position.subtract(e.position);
          dir.y = 0;
          const distToPlayer = dir.length();
          if (distToPlayer > 0.01) {
            dir.normalize();
            e.position.x += dir.x * e.metadata.speed * dt;
            e.position.z += dir.z * e.metadata.speed * dt;
          }

          // enemy hits player
          if (distToPlayer < 1.3) {
            playerHP -= 20 * dt; // damage per second while touching
            hpEl.textContent = Math.max(0, Math.floor(playerHP));
            barFill.width = (290 * Math.max(0, playerHP) / 100) + "px";
            if (playerHP <= 0 && !gameOver) {
              gameOver = true;
              gameoverEl.style.display = "block";
            }
          }
        }

        // --- spawning ---
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnEnemy();
          spawnTimer = spawnInterval;
          spawnInterval = Math.max(0.6, spawnInterval * 0.97); // ramp difficulty
        }

        // --- audio-reactive visuals (the whole point of this exercise) ---
        updateBass();

        // camera "punch in" on bass hits, like the OrthographicSize shrink in the C#
        camera.radius = 15 - bass * 4;
        // small random shake added on top while bass is active, for that volatile feel
        if (bass > 0.05) {
          camera.targetScreenOffset.x = (Math.random() - 0.5) * bass * 0.3;
          camera.targetScreenOffset.y = (Math.random() - 0.5) * bass * 0.3;
        } else {
          camera.targetScreenOffset.x = 0;
          camera.targetScreenOffset.y = 0;
        }

        // bloom/aberration intensity scale with loudness
        pipeline.bloomWeight = 0.4 + bass * 1.5;
        pipeline.bloomThreshold = Math.max(0.1, 0.6 - bass * 0.3);
        pipeline.chromaticAberration.aberrationAmount = bass * 30;

        // cycling color, same Lerp-between-two-colors-then-advance pattern as CycleTextColor
        colorLerpT += bass * dt * 4 + dt * 0.15;
        if (colorLerpT >= 1) {
          colorLerpT = 0;
          colorIdx = (colorIdx + 1) % beatColors.length;
        }
        const nextIdx = (colorIdx + 1) % beatColors.length;
        const beatColor = BABYLON.Color3.Lerp(beatColors[colorIdx], beatColors[nextIdx], colorLerpT);

        // enemies pulse color + scale with the beat, filling the role of the horse1-4 RawImages
        for (const e of enemies) {
          e.material.emissiveColor = beatColor.scale(bass);
          const pulse = 1 + bass * 0.6;
          e.scaling.set(pulse, pulse, pulse);
        }

        // player glows a bit too on hard hits
        playerMat.emissiveColor = beatColor.scale(bass * 0.5);

        // decorative GUI images pulse scale + tint with the beat, same role as horse1-4
        const decoScale = 1 + bass * 0.8;
        for (const img of decoImages) {
          img.scaleX = decoScale;
          img.scaleY = decoScale;
          img.color = beatColor.toHexString();
          img.alpha = 0.5 + bass * 0.5;
          // vibration: jitter the image's on-screen offset while bass is hitting hard
          if (bass > 0.1) {
            img.left = (Math.random() - 0.5) * bass * 20 + "px";
            img.top = (Math.random() - 0.5) * bass * 20 + "px";
          } else {
            img.left = "0px";
            img.top = "0px";
          }
        }
      });

      return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });
  </script>
</body>
</html>
