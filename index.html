<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Crappy Hack-n-Slash</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #111; }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: absolute; top: 10px; left: 10px; color: white;
      font-family: monospace; font-size: 20px; text-shadow: 1px 1px 2px black;
      pointer-events: none; user-select: none;
    }
    #gameover {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
      color: red; font-family: monospace; font-size: 48px; display: none;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="hud">HP: <span id="hp">100</span> | Kills: <span id="kills">0</span></div>
  <div id="gameover">YOU DIED<br><span style="font-size:20px">refresh to try again</span></div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    // ---- Game state ----
    let playerHP = 100;
    let kills = 0;
    let gameOver = false;
    const enemies = [];
    const ATTACK_RANGE = 2.5;
    const ATTACK_COOLDOWN = 0.5; // seconds
    let attackTimer = 0;

    const hpEl = document.getElementById("hp");
    const killsEl = document.getElementById("kills");
    const gameoverEl = document.getElementById("gameover");

    const createScene = function () {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color3(0.05, 0.05, 0.08);

      // ---- Camera (top-down-ish follow cam) ----
      const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2, 1.0, 25, BABYLON.Vector3.Zero(), scene);
      camera.lowerRadiusLimit = 15;
      camera.upperRadiusLimit = 15;
      camera.lowerBetaLimit = 1.0;
      camera.upperBetaLimit = 1.0;
      camera.inputs.clear(); // no mouse dragging, we control it manually

      // ---- Light ----
      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
      light.intensity = 0.9;

      // ---- Ground ----
      const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 60, height: 60 }, scene);
      const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
      groundMat.diffuseColor = new BABYLON.Color3(0.2, 0.3, 0.2);
      ground.material = groundMat;

      // ---- Player ----
      const player = BABYLON.MeshBuilder.CreateCapsule("player", { height: 2, radius: 0.5 }, scene);
      player.position.y = 1;
      const playerMat = new BABYLON.StandardMaterial("playerMat", scene);
      playerMat.diffuseColor = new BABYLON.Color3(0.2, 0.6, 1);
      player.material = playerMat;

      // ---- Input ----
      const inputMap = {};
      scene.actionManager = new BABYLON.ActionManager(scene);
      scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger, (e) => {
        inputMap[e.sourceEvent.key.toLowerCase()] = true;
      }));
      scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger, (e) => {
        inputMap[e.sourceEvent.key.toLowerCase()] = false;
      }));

      // ---- Enemy spawning ----
      function spawnEnemy() {
        const enemy = BABYLON.MeshBuilder.CreateBox("enemy", { size: 1.2 }, scene);
        const mat = new BABYLON.StandardMaterial("enemyMat", scene);
        mat.diffuseColor = new BABYLON.Color3(1, 0.2, 0.2);
        enemy.material = mat;

        // spawn at a random point on a circle around the player
        const angle = Math.random() * Math.PI * 2;
        const dist = 20;
        enemy.position.x = player.position.x + Math.cos(angle) * dist;
        enemy.position.z = player.position.z + Math.sin(angle) * dist;
        enemy.position.y = 0.6;

        enemy.metadata = { speed: 3 + Math.random() * 1.5 };
        enemies.push(enemy);
      }

      let spawnTimer = 0;
      let spawnInterval = 2.5; // gets faster over time

      // ---- Main loop ----
      scene.onBeforeRenderObservable.add(() => {
        if (gameOver) return;

        const dt = engine.getDeltaTime() / 1000;

        // --- movement ---
        const moveSpeed = 8;
        let dx = 0, dz = 0;
        if (inputMap["w"] || inputMap["arrowup"]) dz += 1;
        if (inputMap["s"] || inputMap["arrowdown"]) dz -= 1;
        if (inputMap["a"] || inputMap["arrowleft"]) dx -= 1;
        if (inputMap["d"] || inputMap["arrowright"]) dx += 1;

        const moveVec = new BABYLON.Vector3(dx, 0, dz);
        if (moveVec.length() > 0) {
          moveVec.normalize();
          player.position.x += moveVec.x * moveSpeed * dt;
          player.position.z += moveVec.z * moveSpeed * dt;
          // face movement direction
          player.rotation.y = Math.atan2(moveVec.x, moveVec.z);
        }

        // camera follows player
        camera.target.x = player.position.x;
        camera.target.z = player.position.z;

        // --- attack ---
        attackTimer -= dt;
        if (inputMap[" "] && attackTimer <= 0) {
          attackTimer = ATTACK_COOLDOWN;
          for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            if (BABYLON.Vector3.Distance(player.position, e.position) <= ATTACK_RANGE) {
              e.dispose();
              enemies.splice(i, 1);
              kills++;
              killsEl.textContent = kills;
            }
          }
        }

        // --- enemies chase player ---
        for (const e of enemies) {
          const dir = player.position.subtract(e.position);
          dir.y = 0;
          const distToPlayer = dir.length();
          if (distToPlayer > 0.01) {
            dir.normalize();
            e.position.x += dir.x * e.metadata.speed * dt;
            e.position.z += dir.z * e.metadata.speed * dt;
          }

          // enemy hits player
          if (distToPlayer < 1.3) {
            playerHP -= 20 * dt; // damage per second while touching
            hpEl.textContent = Math.max(0, Math.floor(playerHP));
            if (playerHP <= 0 && !gameOver) {
              gameOver = true;
              gameoverEl.style.display = "block";
            }
          }
        }

        // --- spawning ---
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnEnemy();
          spawnTimer = spawnInterval;
          spawnInterval = Math.max(0.6, spawnInterval * 0.97); // ramp difficulty
        }
      });

      return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });
  </script>
</body>
</html>
